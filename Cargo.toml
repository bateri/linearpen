[package]
name = "linearpen"
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "A Linear client in the terminal pane: your issues and lists, filters and search, values and comments you change there, and an agent started on the issue you open"
repository = "https://github.com/bateri/linearpen"

[[bin]]
name = "linearpen"
path = "src/program/main.rs"

[dependencies]
# The program's side of pencere, at one commit: every pencere crate here is at this one `rev`,
# which Cargo.lock holds and `make pencere`, `make fake-host` and `make dev` build the terminal from.
pencere = { git = "https://github.com/bateri/pencere", rev = "fe6f14ca05037f9655c6f78539ac3bb3bd62fbe7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# What a PDF's pages say of their words: the interpreter runs a page's content and says each letter it would
# draw and where, to select, copy and find them (the terminal draws the pages; this reads the same file for
# their text). Pure Rust, Apache-2.0 OR MIT; the version and the features are textpen's (user decision
# 2026-11-19): `embed-fonts` so that the letters of a page whose fonts are not in the file
# (Helvetica and the other thirteen) are said too, as pencere's sandbox draws them, and `embed-cmaps` so
# that Chinese, Japanese and Korean text drawn through the predefined CMaps can be found and copied too.
hayro-interpret = { version = "0.9", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
# The client's own screen where the terminal hosts no view: the page drawn as pictures in the terminal it
# is started in, where that speaks the Kitty graphics protocol (the `terminal` feature), with the
# interpreter compiled by the build.
pencere-tui = { git = "https://github.com/bateri/pencere", rev = "fe6f14ca05037f9655c6f78539ac3bb3bd62fbe7", optional = true, default-features = false, features = ["precompile"] }

[features]
default = ["terminal"]
terminal = ["dep:pencere-tui"]

[build-dependencies]
pencere = { git = "https://github.com/bateri/pencere", rev = "fe6f14ca05037f9655c6f78539ac3bb3bd62fbe7" }

[dev-dependencies]
# Each test has a directory of its own as its home.
tempfile = "3"
# The page (src/view/) run as a terminal runs it, with no screen: the kit's interpreter and editors,
# a clock the test moves, and the program's own handlers in this process (`program`); and pictures
# of it for the eye, in the fonts of the machine (`shot`, `make shots`).
pencere-drive = { git = "https://github.com/bateri/pencere", rev = "fe6f14ca05037f9655c6f78539ac3bb3bd62fbe7", features = ["program", "shot"] }
# The names of the page's elements (`Id`).
pencere-view = { git = "https://github.com/bateri/pencere", rev = "fe6f14ca05037f9655c6f78539ac3bb3bd62fbe7" }
# The files of a page's bundle (`Assets`): a test's own script beside the page; and what a page's
# calls are held to (`ModuleLimits`).
pencere-sandbox = { git = "https://github.com/bateri/pencere", rev = "fe6f14ca05037f9655c6f78539ac3bb3bd62fbe7" }

# The page tests compile the kit's interpreter to machine code, with wasmtime's code generator, as
# each page opens; built without optimization (a debug build) that takes some 13 seconds a page,
# optimized about one. The generator and what feeds it are optimized in the development profile
# too, as pencere's own workspace does: compiled once, cached with the rest.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
